[sdl]
fullscreen=false
output=opengl
[dosbox]
machine=svga_s3
memsize=16
[cpu]
core=normal
cputype=386
cpu_cycles=max
cpu_cycles_protected=auto
cpu_throttle=1
[mixer]
nosound=true
rate=44100
blocksize=1024
prebuffer=25
[autoexec]
mount c tools\msc6.0\C600
c:
path c:\bin;c:\binb
set INCLUDE=c:\include
set LIB=c:\lib
cl test_compile.c